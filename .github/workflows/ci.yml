name: AutoPulse Android CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Enforce 500-Line Gate, Kotlin Test Suite & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce 500-Line File Limit (GEMINI.md Rule #2)
        run: ./gradlew checkLineLimits --no-daemon

      - name: Run Full JUnit & Coroutine Test Suite
        run: ./gradlew :core:test --no-daemon

      - name: Assemble Installable Android APK & Release Bundle
        run: ./gradlew :app:assembleDebug :app:assembleRelease releaseBundle --no-daemon

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopulse-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
