name: AutoPulse Automated Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build Installable Android APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce 500-Line File Limit
        run: ./gradlew checkLineLimits --no-daemon

      - name: Execute Automated Test Suite
        run: ./gradlew :core:test --no-daemon

      - name: Build Installable Android APK & Release Bundle
        run: ./gradlew :app:assembleDebug :app:assembleRelease releaseBundle --no-daemon

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk "dist-release/autopulse-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist-release/autopulse-${GITHUB_REF_NAME}-debug.apk"
          cp build/distributions/*.zip dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt

      - name: Upload Android APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopulse-release-apk
          path: dist-release/*.apk
          if-no-files-found: error

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > dist-release/RELEASE_NOTES.md
          if [ ! -s dist-release/RELEASE_NOTES.md ]; then
            cp CHANGELOG.md dist-release/RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoPulse Android ${{ github.ref_name }}"
          body_path: dist-release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist-release/*.apk
            dist-release/*.zip
            dist-release/SHA256SUMS.txt
