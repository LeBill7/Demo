name: AutoPulse Android Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Android APK & Upload Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit & Coroutine Test Suite
        run: ./gradlew :core:test --no-daemon

      - name: Assemble Installable Android APKs & Release Bundle
        run: ./gradlew :app:assembleDebug :app:assembleRelease releaseBundle --no-daemon

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autopulse-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Artifacts & Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk "dist-release/autopulse-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist-release/autopulse-${GITHUB_REF_NAME}-debug.apk"
          cp build/distributions/*.zip dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > dist-release/RELEASE_NOTES.md
          if [ ! -s dist-release/RELEASE_NOTES.md ]; then
            cp CHANGELOG.md dist-release/RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoPulse Android ${{ github.ref_name }}"
          body_path: dist-release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist-release/*.apk
            dist-release/*.zip
            dist-release/SHA256SUMS.txt
